name: Deploy Firebase Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - '.github/workflows/firebase-deploy.yml'

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOOGLE_CREDENTIALS_AVAILABLE: ${{ secrets.GOOGLE_CREDENTIALS != '' }}
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      
      - name: Instalar dependências
        run: npm ci
        working-directory: functions

      - name: Validar Functions
        run: npm run check
        working-directory: functions

      # Cria o functions/.env a partir dos GitHub Secrets
      # A chave privada VAPID nunca fica no repositório
      - name: Criar functions/.env
        run: |
          cat > functions/.env << 'EOF'
          VAPID_PUBLIC_KEY=BOD3066MNR-gYBI6qquZcm2RxlN_ia_dQtADtGZGhan7SeuxcN6T8WwWB0sEnMpWpQ0aS0OkwoItlgYza1MkiRg
          VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_MAILTO=mailto:contato@saposleague.com
          SUPABASE_PROJECT_URL=https://yaapgjkvkhsfsskkbmso.supabase.co
          ADMIN_FIREBASE_UIDS=HClXNJyivTWibYcrirCYxhM96Ze2
          EOF

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Autenticar no Google Cloud
        if: env.GOOGLE_CREDENTIALS_AVAILABLE == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GOOGLE_CREDENTIALS }}'

      - name: Deploy para Firebase com credenciais de serviço
        if: env.GOOGLE_CREDENTIALS_AVAILABLE == 'true'
        run: firebase deploy --only functions,firestore:rules --non-interactive --force

      - name: Deploy para Firebase com token legado
        if: env.GOOGLE_CREDENTIALS_AVAILABLE != 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only functions,firestore:rules --token "$FIREBASE_TOKEN" --non-interactive --force
      
      - name: Notificar sucesso
        if: success()
        run: echo "✅ Deploy realizado com sucesso!"
      
      - name: Notificar falha
        if: failure()
        run: echo "❌ Deploy falhou. Verifique os logs acima."
